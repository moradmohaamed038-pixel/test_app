workflows:
  android-release:
    name: Android Release APK
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: stable
      java: 11
    scripts:
      - flutter pub get
      - flutter analyze
      - flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk